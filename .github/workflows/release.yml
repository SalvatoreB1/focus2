name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk focus2-debug.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: focus2-debug.apk
          name: FOCUS2 ${{ github.ref_name }}
          body: |
            🚀 **FOCUS2 para Android** (${{ github.ref_name }})
            
            - Corregido el solapamiento de notificaciones (Toasts ahora en cabecera con z-index 9999).
            - Exportación nativa de copias de seguridad JSON mediante diálogo de compartir de Android.
            - Eliminado el caché conflictivo de Service Workers para prevenir pantallas vacías en actualizaciones.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
