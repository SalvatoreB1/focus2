name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.ref_name }}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" focus2-debug.apk --clobber
          else
            gh release create "$TAG" focus2-debug.apk \
              --title "FOCUS2 ${TAG}" \
              --notes "🚀 **FOCUS2 para Android (${TAG})**

              Descarga el archivo APK adjunto **focus2-debug.apk** para instalar o actualizar la app en tu teléfono Android."
          fi
